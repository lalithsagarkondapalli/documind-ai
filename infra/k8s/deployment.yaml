apiVersion: apps/v1
kind: Deployment
metadata:
  name: documind-api
  namespace: documind
  labels: {app.kubernetes.io/name: documind-api, app.kubernetes.io/part-of: documind-ai}
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app.kubernetes.io/name: documind-api}
  template:
    metadata:
      labels: {app.kubernetes.io/name: documind-api, app.kubernetes.io/part-of: documind-ai}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: documind-api}
      containers:
        - name: api
          image: documind-api:placeholder   # replaced by kustomize `images:` / the deploy workflow
          ports: [{name: http, containerPort: 8000}]
          envFrom:
            - configMapRef: {name: documind-config}
            - secretRef: {name: documind-secrets}
          readinessProbe:      # /ready checks the database, so a pod with no DB gets no traffic
            httpGet: {path: /ready, port: http}
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 20
            periodSeconds: 15
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: 24
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
