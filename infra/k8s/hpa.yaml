apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: documind-api
  namespace: documind
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: documind-api}
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 65}}
  behavior:
    scaleDown: {stabilizationWindowSeconds: 300}
