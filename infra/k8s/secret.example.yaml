# EXAMPLE ONLY - not part of kustomization.yaml and contains no real values.
# Create the real secret out-of-band (kubectl create secret generic ..., or External Secrets Operator
# syncing from AWS Secrets Manager using the ARNs in `terraform output`). Never commit real secrets.
apiVersion: v1
kind: Secret
metadata:
  name: documind-secrets
  namespace: documind
type: Opaque
stringData:
  JWT_SECRET: "REPLACE_ME"
  DATABASE_URL: "postgresql+psycopg://USER:PASSWORD@RDS_ENDPOINT:5432/documind"
  REDIS_URL: "rediss://:AUTH_TOKEN@ELASTICACHE_ENDPOINT:6379/0"
  ANTHROPIC_API_KEY: "REPLACE_ME"
