receivers:
  otlp:
    protocols:
      http: {endpoint: 0.0.0.0:4318}
processors:
  batch: {}
exporters:
  debug: {verbosity: basic}      # swap for Tempo/Jaeger/Phoenix OTLP exporter in a real environment
service:
  pipelines:
    traces: {receivers: [otlp], processors: [batch], exporters: [debug]}
